<!DOCTYPE html>
<html>
<head>
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Daily Fitness Tracker</h1>
</header>

<div class="container">

    <h2>Today's Activity</h2>

    <label>Steps</label>
    <input type="number" id="steps" placeholder="Enter steps">

    <label>Calories Burned</label>
    <input type="number" id="calories" placeholder="Enter calories">

    <label>Water Intake (Litres)</label>
    <input type="number" id="water" placeholder="Enter water intake">

    <label>Workout Duration (Minutes)</label>
    <input type="number" id="workout" placeholder="Enter workout duration">

    <br>

    <a href="profile.html">
        <button>← Back</button>
    </a>

    <a href="bmi.html">
        <button>Next →</button>
    </a>

</div>

</body>
</html>
